name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Имя архива в корне репозитория
  ARCHIVE: allow-section-sign.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack archive
        run: |
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Архив $ARCHIVE не найден в корне репозитория"
            exit 1
          fi
          unzip -q -o "$ARCHIVE" -d unpacked
          SETTINGS=$(find unpacked -maxdepth 3 -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::В архиве не найден settings.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Проект распакован в $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Gradle ставится экшеном, поэтому gradle-wrapper в архиве не обязателен.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.1

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: allow-section-sign
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error

  # Релиз на GitHub создаётся при пуше тега вида v1.0.0
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: allow-section-sign
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
